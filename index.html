<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen's Ulba — SD Islam Ulul Albab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F8FD;
    --surface:#FFFFFF;
    --ink:#1E2A38;
    --ink-muted:#6C7F92;
    --teal:#4A90D9;
    --teal-dark:#1D5FA3;
    --teal-soft:#E6F1FC;
    --gold:#4A90D9;
    --gold-soft:#E6F1FC;
    --rose:#C0594A;
    --rose-soft:#FBEBE7;
    --border:#DCE9F5;
    --radius:12px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --shadow: 0 1px 2px rgba(29,95,163,0.08), 0 4px 16px rgba(29,95,163,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Geometric signature pattern ---------- */
  .geo-band{
    height:10px;
    width:100%;
    background-image:
      linear-gradient(135deg, var(--gold) 25%, transparent 25.5%),
      linear-gradient(225deg, var(--gold) 25%, transparent 25.5%),
      linear-gradient(45deg, var(--gold) 25%, transparent 25.5%),
      linear-gradient(315deg, var(--gold) 25%, transparent 25.5%);
    background-position: 10px 0, 10px 0, 0 0, 0 0;
    background-size: 20px 20px;
    background-color: var(--teal-dark);
    background-repeat:repeat-x;
    background-size:20px 100%;
    opacity:0.9;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--teal-dark);
    color:#fff;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:22px 20px 14px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .brand-eyebrow{
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .brand-title{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:600;
    line-height:1.25;
    color:#fff;
  }
  nav{padding:14px 10px; flex:1; overflow-y:auto;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:9px;
    color:rgba(255,255,255,0.72);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    margin-bottom:2px;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .nav-item.active{background:var(--teal); color:#fff;}
  .nav-icon{width:17px; text-align:center; font-size:14px;}
  .sidebar-foot{
    padding:14px 20px 18px;
    font-size:11px;
    color:rgba(255,255,255,0.45);
    border-top:1px solid rgba(255,255,255,0.1);
  }

  /* ---------- Main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:18px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #topbar h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0;
  }
  #topbar p{margin:2px 0 0; color:var(--ink-muted); font-size:12.5px;}
  #content{padding:26px 32px 60px; flex:1;}

  .save-badge{
    font-size:11.5px;
    color:var(--ink-muted);
    display:flex; align-items:center; gap:6px;
  }
  .save-dot{width:7px; height:7px; border-radius:50%; background:#3E9B5E; flex-shrink:0;}
  .save-dot.saving{background:var(--gold); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Cards / layout helpers ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:18px 20px;}
  .stat-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:600;}
  .stat-value{font-family:var(--font-display); font-size:30px; font-weight:600; margin-top:6px; color:var(--teal-dark);}
  .stat-sub{font-size:12px; color:var(--ink-muted); margin-top:4px;}

  h2.section-title{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--teal-dark);
  }
  .banner{
    border-radius:var(--radius);
    padding:13px 16px;
    font-size:13px;
    display:flex; gap:10px; align-items:flex-start;
    margin-bottom:18px;
  }
  .banner.warn{background:var(--rose-soft); color:#7A3626; border:1px solid #E6C3B7;}
  .banner.info{background:var(--teal-soft); color:var(--teal-dark); border:1px solid #CFE3DD;}

  /* ---------- Forms ---------- */
  input[type=text], input[type=number], select{
    font-family:var(--font-body);
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{border-color:var(--teal);}
  .btn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .05s, opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-outline{background:#fff; border-color:var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal); color:var(--teal);}
  .btn-danger{background:var(--rose-soft); color:var(--rose);}
  .btn-danger:hover{background:#EFCFC5;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn-gold{background:var(--gold); color:#3a2c07;}
  .btn-gold:hover{opacity:.9;}

  /* ---------- Tables ---------- */
  table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.data-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-muted); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--border);
    background:#FAF7F0; position:sticky; top:0;
  }
  table.data-table td{padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.data-table tr:hover td{background:#FBFAF5;}
  .table-scroll{max-height:560px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius);}
  .table-scroll table.data-table th{top:0;}
  .table-scroll .card{box-shadow:none;}

  .pill{
    display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600;
  }
  .pill-teal{background:var(--teal-soft); color:var(--teal-dark);}
  .pill-gold{background:var(--gold-soft); color:#7A5C10;}
  .pill-gray{background:#EFEBE0; color:var(--ink-muted);}
  .pill-rose{background:var(--rose-soft); color:var(--rose);}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar .grow{flex:1; min-width:180px;}
  input.search-input{width:100%;}

  .room-card{border:1px solid var(--border); border-radius:var(--radius); background:#fff; margin-bottom:16px; overflow:hidden;}
  .room-card-head{
    background:var(--teal-soft); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .room-card-head .room-name{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--teal-dark);}
  .room-card-head .room-guru{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .room-card-body{padding:0;}
  .capacity-bar{width:120px; height:6px; border-radius:99px; background:#E4DFD2; overflow:hidden;}
  .capacity-fill{height:100%; background:var(--teal);}
  .capacity-fill.over{background:var(--rose);}

  .level-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .level-tab{
    padding:8px 14px; border-radius:99px; font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--ink-muted); user-select:none;
  }
  .level-tab.active{background:var(--teal); border-color:var(--teal); color:#fff;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-muted);}
  .empty-state .big{font-family:var(--font-display); font-size:18px; color:var(--ink); margin-bottom:6px;}

  .pagination{display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:12.5px; color:var(--ink-muted);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#D8D2C0; border-radius:99px;}

  @media (max-width:860px){
    #sidebar{position:fixed; left:-260px; z-index:50; transition:left .2s; box-shadow:4px 0 24px rgba(0,0,0,0.2);}
    #sidebar.open{left:0;}
    #content{padding:18px;}
    #topbar{padding:14px 18px;}
    .grid-4{grid-template-columns:1fr 1fr;}
    #menuToggle{display:inline-flex !important;}
  }

  /* ---------- Sidebar logos ---------- */
  .brand-logos{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;}
  .brand-logos img{height:44px; width:44px; object-fit:contain; border-radius:8px; background:#fff; padding:3px;}
  .brand-title{text-align:center;}
  .brand-eyebrow{text-align:center;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-image:
      linear-gradient(160deg, rgba(29,95,163,0.88) 0%, rgba(74,144,217,0.80) 55%, rgba(230,241,252,0.55) 100%),
      var(--login-bg-image, none);
    background-size:cover;
    background-position:center;
    background-blend-mode:normal;
    padding:20px;
  }
  .login-card{
    background:var(--surface); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.25);
    padding:34px 32px 26px; width:100%; max-width:380px; text-align:center;
  }
  .login-logos{display:flex; justify-content:center; gap:14px; margin-bottom:14px;}
  .login-logos img{height:64px; width:64px; object-fit:contain;}
  .login-title{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--teal-dark);}
  .login-sub{font-size:12.5px; color:var(--ink-muted); margin:6px 0 22px; line-height:1.5;}
  .login-label{display:block; text-align:left; font-size:12px; font-weight:600; color:var(--ink-muted); margin:12px 0 5px;}
  .login-input{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:var(--font-body);}
  .login-input:focus{outline:none; border-color:var(--teal);}
  .login-error{color:var(--rose); font-size:12.5px; min-height:18px; margin-top:10px; text-align:left;}
  .login-hint{font-size:11.5px; color:var(--ink-muted); margin-top:16px;}

  /* ---------- Autocomplete search (Uji Kenaikan siswa) ---------- */
  .autocomplete-wrap{position:relative;}
  .autocomplete-results{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); max-height:280px; overflow-y:auto;
  }
  .autocomplete-item{
    padding:9px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover{background:var(--teal-soft);}
  .autocomplete-item-sub{font-size:11.5px; color:var(--ink-muted); white-space:nowrap;}
  .autocomplete-empty{padding:12px 14px; font-size:13px; color:var(--ink-muted); text-align:center;}

  /* ---------- Custom modal (replaces blocked confirm/alert) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(14,67,33,0.35); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:#fff; border-radius:14px; max-width:360px; width:100%;
    padding:22px 22px 18px; box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal-message{font-size:14px; line-height:1.5; margin-bottom:18px; white-space:pre-line;}
  .modal-buttons{display:flex; gap:10px; justify-content:flex-end;}
</style>
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logos">
      <img src="LOGO1_PLACEHOLDER" alt="Logo SD Islam Ulul Albab">
      <img src="LOGO2_PLACEHOLDER" alt="Logo Trias Cendekia School">
    </div>
    <div class="login-title">Gen's Ulba</div>
    <div class="login-sub">Sistem Pembagian &amp; Penilaian Tilawati<br>SD Islam Ulul Albab</div>
    <form id="loginForm">
      <label class="login-label">Username</label>
      <input type="text" id="loginUsername" class="login-input" autocomplete="username" placeholder="Username">
      <label class="login-label">Password</label>
      <input type="password" id="loginPassword" class="login-input" autocomplete="current-password" placeholder="Password">
      <div id="loginPengujiNameWrap" style="display:none;">
        <label class="login-label">Nama Penguji (untuk tanda tangan blanko)</label>
        <input type="text" id="loginPengujiName" class="login-input" placeholder="Nama lengkap Anda">
      </div>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px; margin-top:6px;">Masuk</button>
    </form>
    <div class="login-hint">Hubungi admin sekolah kalau lupa username/password.</div>
    <div id="storageModeHint" class="login-hint" style="margin-top:4px;"></div>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logos">
        <img src="LOGO1_PLACEHOLDER" alt="Logo SD Islam Ulul Albab">
        <img src="LOGO2_PLACEHOLDER" alt="Logo Trias Cendekia School">
      </div>
      <div class="brand-title">Gen's Ulba</div>
      <div class="brand-eyebrow">SD Islam Ulul Albab</div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <div id="whoAmI" style="margin-bottom:8px; font-weight:600; color:#fff;"></div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Data tersimpan otomatis.</span>
        <button id="logoutBtn" class="btn btn-sm" style="background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25);">Keluar</button>
      </div>
    </div>
  </aside>
  <div id="main">
    <div class="geo-band"></div>
    <div id="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button id="menuToggle" class="btn btn-outline btn-sm" style="display:none;">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub">Ringkasan sistem pembagian Tilawati</p>
        </div>
      </div>
      <div class="save-badge"><span class="save-dot" id="saveDot"></span><span id="saveText">Tersimpan</span></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ===================== CUSTOM MODAL (confirm/alert) ===================== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div id="modalMessage" class="modal-message"></div>
    <div id="modalButtons" class="modal-buttons"></div>
  </div>
</div>

function setSaving(isSaving){
  const dot = document.getElementById('saveDot');
  const txt = document.getElementById('saveText');
  if(!dot) return;
  if(isSaving){ dot.classList.add('saving'); txt.textContent = 'Menyimpan...'; }
  else { dot.classList.remove('saving'); txt.textContent = 'Tersimpan'; }
}

/* ======================= CUSTOM MODAL (native confirm/alert are blocked in sandboxed artifacts) ======================= */
function showAlert(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const btnWrap = document.getElementById('modalButtons');
    btnWrap.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.className = 'btn btn-primary';
    okBtn.textContent = 'OK';
    okBtn.onclick = ()=>{ overlay.classList.add('hidden'); resolve(); };
    btnWrap.appendChild(okBtn);
    overlay.classList.remove('hidden');
    okBtn.focus();
  });
}

function showConfirm(message, confirmLabel){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const btnWrap = document.getElementById('modalButtons');
    btnWrap.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-outline';
    cancelBtn.textContent = 'Batal';
    cancelBtn.onclick = ()=>{ overlay.classList.add('hidden'); resolve(false); };
    const okBtn = document.createElement('button');
    okBtn.className = 'btn btn-danger';
    okBtn.textContent = confirmLabel || 'Ya, Hapus';
    okBtn.onclick = ()=>{ overlay.classList.add('hidden'); resolve(true); };
    btnWrap.appendChild(cancelBtn);
    btnWrap.appendChild(okBtn);
    overlay.classList.remove('hidden');
  });
}

   3. localStorage - cadangan terakhir, data hanya tersimpan di browser masing-masing
      (dipakai kalau SHEETS_API_URL belum diisi dan bukan di dalam Claude).

   CARA AKTIFKAN GOOGLE SHEETS:
   Ikuti panduan di file Code.gs yang disertakan, lalu ganti nilai
   SHEETS_API_URL di bawah ini dengan URL Web App hasil deploy kamu. */
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbycSKd9BIRQk-jZrujKfjzUdprTCA_AqjA41eruLy0QTc2TFDi-AchpUNHFYMpC9WVN/exec";

const LS_PREFIX = 'gens-ulba::';

function hasSheetsApi(){
  return typeof SHEETS_API_URL === 'string' && SHEETS_API_URL && SHEETS_API_URL.indexOf('GANTI_') !== 0;
}
function hasNativeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function storageGet(key){
  try{
    if(hasSheetsApi()){
      const res = await fetch(SHEETS_API_URL + '?action=get&key=' + encodeURIComponent(key));
      const data = await res.json();
      return (data && data.value !== undefined && data.value !== null && data.value !== '') ? JSON.parse(data.value) : null;
    }
    if(hasNativeStorage()){
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : null;
    }
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('storageGet gagal', key, e);
    return null;
  }
}

async function storageSet(key, value){
  setSaving(true);
  try{
    if(hasSheetsApi()){
      // Content-Type text/plain sengaja dipakai supaya browser tidak mengirim
      // preflight OPTIONS request, karena Google Apps Script tidak menanganinya.
      await fetch(SHEETS_API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'set', key: key, value: JSON.stringify(value) })
      });
    }else if(hasNativeStorage()){
      await window.storage.set(key, JSON.stringify(value), true);
    }else{
      localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    }
  }catch(e){
    console.error('Gagal menyimpan', key, e);
  }
  setSaving(false);
}

const saveTimers = {};
function persist(key, value){
  // debounce writes per-key so saving one list doesn't cancel another's pending save
  clearTimeout(saveTimers[key]);
  setSaving(true);
  saveTimers[key] = setTimeout(()=>{ storageSet(key, value); }, 350);
}

async function storageList(prefix){
  try{
    if(hasSheetsApi()){
      const res = await fetch(SHEETS_API_URL + '?action=list&prefix=' + encodeURIComponent(prefix));
      const data = await res.json();
      return (data && data.keys) ? data.keys : [];
    }
    if(hasNativeStorage()){
      const res = await window.storage.list(prefix, true);
      return res ? res.keys : [];
    }
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LS_PREFIX + prefix) === 0){
        keys.push(k.slice(LS_PREFIX.length));
      }
    }
    return keys;
  }catch(e){
    console.error('storageList gagal', prefix, e);
    return [];
  }
}

async function loadAllData(){
  const [siswa, guru, quota] = await Promise.all([
    storageGet('siswa-list'),
    storageGet('guru-list'),
    storageGet('room-quota'),
  ]);

  if(siswa && siswa.length){
    state.siswaList = siswa;
  }else{
    state.siswaList = SEED_SISWA.slice();
    storageSet('siswa-list', state.siswaList);
  }

  if(guru && guru.length){
    state.guruList = guru;
  }else{
    state.guruList = SEED_GURU.slice();
    storageSet('guru-list', state.guruList);
  }

  if(quota){
    state.roomQuota = quota;
  }else{
    state.roomQuota = {};
    storageSet('room-quota', state.roomQuota);
  }

  // Penilaian disimpan 1 key per catatan (bukan 1 array besar) supaya aman
  // ditulis banyak Penguji secara bersamaan tanpa saling menimpa punya orang lain.
  const penilaianKeys = await storageList('penilaian:');
  const penilaianResults = await Promise.all(penilaianKeys.map(k => storageGet(k)));
  state.penilaianList = penilaianResults.filter(Boolean).sort((a,b)=> (b.ts||0) - (a.ts||0));

  state.loaded = true;
}

async function savePenilaian(record){
  await storageSet('penilaian:' + record.id, record);
}

// Re-fetch siswa-list langsung dari storage sebelum menulis perubahan penting
// (misal kenaikan tingkat), supaya tidak menimpa perubahan orang lain yang baru masuk.
async function updateSiswaSafely(siswaId, patchFn){
  const latest = await storageGet('siswa-list');
  const list = (latest && latest.length) ? latest : state.siswaList.slice();
  const idx = list.findIndex(s=>s.id===siswaId);
  if(idx === -1) return null;
  const updated = {...list[idx]};
  patchFn(updated);
  list[idx] = updated;
  await storageSet('siswa-list', list);
  state.siswaList = list;
  return updated;
}

// Generic read-merge-write helper used by every Data Siswa / Data Guru edit.
// Selalu mengambil data TERBARU dari penyimpanan bersama dulu sebelum
// menerapkan perubahan lokal, lalu menulis hasil gabungannya. Ini mencegah
// dua Admin yang membuka halaman bersamaan saling menimpa data satu sama lain
// (bug "data hilang" saat dibuka bareng dua Admin).
async function safeListUpdate(key, stateKey, mutateFn){
  setSaving(true);
  try{
    const latest = await storageGet(key);
    const list = (latest && Array.isArray(latest) && latest.length) ? latest : state[stateKey].slice();
    mutateFn(list);
    state[stateKey] = list;
    await storageSet(key, list);
  }catch(e){
    console.error('safeListUpdate gagal', key, e);
  }
  setSaving(false);
}

// Unique rooms for a given level kode, in order of first appearance in guruList
function getRoomsForLevel(kode){
  const seen = [];
  state.guruList.forEach(g=>{
    if(g.kode === kode && g.ruangan && !seen.includes(g.ruangan)){
      seen.push(g.ruangan);
    }
  });
  return seen;
}

// Guru name(s) teaching a given room, joined with " & "
function getGuruForRoom(roomName){
  return state.guruList
    .filter(g=>g.ruangan === roomName)
    .map(g=>g.nama)
    .join(' & ');
}

function getQuotaForRoom(roomName){
  const q = state.roomQuota[roomName];
  return (q && q > 0) ? q : DEFAULT_QUOTA;
}

// Build room assignment for one Tilawati level.
// Returns { rooms: [{room, guru, quota, students:[]}], leftover: [students without a room] }
// Students with a manual room override (s.roomOverride) are placed into that room
// first regardless of quota order, so admin can move students to a less-full room.
function assignRooms(levelLabel){
  const level = LEVELS.find(l=>l.label === levelLabel);
  if(!level) return {rooms:[], leftover:[]};

  const rooms = getRoomsForLevel(level.kode);
  const studentsInLevel = state.siswaList.filter(s=>s.tilawati === levelLabel);

  const roomBuckets = rooms.map(r=>({
    room:r, guru:getGuruForRoom(r), quota:getQuotaForRoom(r), students:[]
  }));

  // Pass 1: manual overrides go straight into their chosen room (even if it goes over quota)
  const manual = studentsInLevel.filter(s=>s.roomOverride && rooms.includes(s.roomOverride));
  manual.forEach(s=>{
    const bucket = roomBuckets.find(b=>b.room === s.roomOverride);
    if(bucket) bucket.students.push(s);
  });

  // Pass 2: remaining students auto-fill rooms with spare capacity, in order
  const remaining = studentsInLevel.filter(s=>!(s.roomOverride && rooms.includes(s.roomOverride)));
  let idx = 0;
  for(const bucket of roomBuckets){
    while(bucket.students.length < bucket.quota && idx < remaining.length){
      bucket.students.push(remaining[idx]);
      idx++;
    }
  }
  const leftover = remaining.slice(idx);
  return {rooms:roomBuckets, leftover};
}

function allDistinctRooms(){
  const seen = [];
  state.guruList.forEach(g=>{
    if(g.ruangan && !seen.includes(g.ruangan)) seen.push(g.ruangan);
  });
  return seen;
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function escapeHtml(str){

  state.ujiForm = {tingkat, materi, catatan:''};
}

function renderUjiResultsOnly(){
  const resultsBox = document.getElementById('ujiSiswaResults');
  if(!resultsBox) return;
  const eligibleSiswa = state.siswaList
    .filter(s=>s.tilawati)
    .slice()
    .sort((a,b)=>a.nama.localeCompare(b.nama));
  const q = (state.ujiSiswaSearch||'').trim().toLowerCase();
  const matches = q ? eligibleSiswa.filter(s=>s.nama.toLowerCase().includes(q)) : eligibleSiswa;
  resultsBox.innerHTML = matches.slice(0,50).map(s=>`
    <div class="autocomplete-item" data-id="${s.id}">
      <span>${escapeHtml(s.nama)}</span>
      <span class="autocomplete-item-sub">${escapeHtml(s.tilawati)} &middot; ${escapeHtml(s.kelas||'-')}</span>
    </div>
  `).join('') || `<div class="autocomplete-empty">Tidak ada siswa yang cocok</div>`;

  resultsBox.querySelectorAll('.autocomplete-item').forEach(item=>{
    item.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      state.ujiSiswaId = item.getAttribute('data-id');
      state.ujiSiswaSearch = '';
      const siswa = state.siswaList.find(s=>s.id===state.ujiSiswaId);
      if(siswa) initUjiForm(siswa.tilawati);
      else state.ujiForm = null;
      render();
    });
  });
}

function bindUjiEvents(){
  const searchInput = document.getElementById('ujiSiswaSearchInput');
  const resultsBox = document.getElementById('ujiSiswaResults');
  if(searchInput && resultsBox){
    const selectSiswa = (id)=>{
      state.ujiSiswaId = id;
      state.ujiSiswaSearch = '';
      const siswa = state.siswaList.find(s=>s.id===id);
      if(siswa) initUjiForm(siswa.tilawati);
      else state.ujiForm = null;
      render();
    };

    searchInput.addEventListener('input', (e)=>{
      state.ujiSiswaSearch = e.target.value;
      state.ujiSiswaId = '';
      state.ujiForm = null;
      const rb = document.getElementById('ujiSiswaResults');
      if(rb) rb.style.display = 'block';
      // re-render only the results list without losing input focus
      renderUjiResultsOnly();
    });
    searchInput.addEventListener('focus', ()=>{
      resultsBox.style.display = 'block';
    });
    searchInput.addEventListener('blur', ()=>{
      // small delay so a click on a result registers before hiding
      setTimeout(()=>{ if(document.getElementById('ujiSiswaResults')) document.getElementById('ujiSiswaResults').style.display = 'none'; }, 150);
    });
    resultsBox.querySelectorAll('.autocomplete-item').forEach(item=>{
      item.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        selectSiswa(item.getAttribute('data-id'));
      });
    });
  }

  const tbody = document.getElementById('ujiMateriTbody');
  if(!tbody) return;

  tbody.querySelectorAll('.uji-status').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      const status = e.target.value;
      state.ujiForm.materi[idx].status = status;
      if(status && NILAI_SUGGEST[status] !== undefined && state.ujiForm.materi[idx].nilai === ''){
        state.ujiForm.materi[idx].nilai = NILAI_SUGGEST[status];
      }
      render();
    });
  });
  tbody.querySelectorAll('.uji-nilai').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      state.ujiForm.materi[idx].nilai = e.target.value;
      render();
    });
    inp.addEventListener('focus', (e)=>{ e.target.select(); });
  });

  const catatanEl = document.getElementById('ujiCatatan');
  if(catatanEl){
    catatanEl.addEventListener('input', (e)=>{ state.ujiForm.catatan = e.target.value; });
  }

  const btnNaik = document.getElementById('btnHasilNaik');
  const btnTetap = document.getElementById('btnHasilTetap');
  if(btnNaik) btnNaik.addEventListener('click', ()=>submitUjiHasil('Naik'));
  if(btnTetap) btnTetap.addEventListener('click', ()=>submitUjiHasil('Tetap'));
}

async function submitUjiHasil(hasil){
  const siswa = state.siswaList.find(s=>s.id===state.ujiSiswaId);
  if(!siswa || !state.ujiForm) return;

  const filledNilai = state.ujiForm.materi.map(m=>parseFloat(m.nilai)).filter(n=>!isNaN(n));
  const nilaiAkhir = filledNilai.length ? Math.round(filledNilai.reduce((a,b)=>a+b,0)/filledNilai.length) : null;
  const tingkatSaat = siswa.tilawati;
  const next = NEXT_LEVEL[tingkatSaat];

  const confirmMsg = hasil === 'Naik'
    ? `Simpan hasil: ${siswa.nama} DINYATAKAN NAIK${next ? ' ke ' + next : ''}?\nNilai akhir: ${nilaiAkhir}`
    : `Simpan hasil: ${siswa.nama} BELUM NAIK, tetap di ${tingkatSaat}?\nNilai akhir: ${nilaiAkhir}`;
  const ok = await showConfirm(confirmMsg, 'Ya, Simpan');
  if(!ok) return;

  const record = {
    id: uid('nil'),
    ts: Date.now(),
    siswaId: siswa.id,
    siswaNama: siswa.nama,
    kelas: siswa.kelas || '',
    tingkatSaat,
    tingkatBaru: (hasil === 'Naik' && next) ? next : tingkatSaat,
    materi: state.ujiForm.materi.map(m=>({nama:m.nama, status:m.status, nilai:m.nilai})),
    nilaiAkhir,
    catatan: state.ujiForm.catatan || '',
    hasil: hasil === 'Naik' ? (next ? 'Naik' : 'Naik (Tingkat Akhir)') : 'Belum Naik',
    penguji: state.pengujiName || (state.role==='admin' ? 'Admin' : '-'),
    tanggal: formatTanggalIndo(new Date()),
  };

  setSaving(true);
  await savePenilaian(record);
  state.penilaianList.unshift(record);

  if(hasil === 'Naik' && next){
    await updateSiswaSafely(siswa.id, s => { s.tilawati = next; });
  }
  setSaving(false);

  state.ujiSiswaId = '';
  state.ujiSiswaSearch = '';
  state.ujiForm = null;
  render();
  await showAlert(`Tersimpan. ${siswa.nama} ${hasil==='Naik' ? ('naik ke ' + (next||'(tingkat akhir)')) : ('tetap di ' + tingkatSaat)}.`);
}

function formatTanggalIndo(d){
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'][d.getDay()];
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
  const tgl = String(d.getDate()).padStart(2,'0');
  return `${hari}, ${tgl} ${bulan} ${d.getFullYear()}`;
}

/* ---- CETAK: mengikuti format resmi "Edaran Kelas Tilawati" sekolah ---- */
function buildPrintDocument(){
  const {rooms} = assignRooms(state.cetakLevel);
  const targetRooms = state.cetakRoom === '__ALL__' ? rooms : rooms.filter(r=>r.room===state.cetakRoom);
  const tanggal = formatTanggalIndo(new Date());

  const pages = targetRooms.map(r=>{
    const quota = getQuotaForRoom(r.room);
    let rowsHtml = '';
    for(let i=0;i<quota;i++){
      const s = r.students[i];
      rowsHtml += `<tr><td class="c-no">${i+1}</td><td class="c-nama">${s?escapeHtml(s.nama):''}</td><td class="c-kelas">${s?escapeHtml(s.kelas||''):''}</td></tr>`;
    }
    return `
    <section class="print-page">
      <div class="edaran-head">
        <img src="${LOGO1_DATA}" class="edaran-logo">
        <div class="edaran-titles">
          <div class="edaran-title">${escapeHtml(state.cetakLevel.toUpperCase())}</div>
          <div class="edaran-title">RUANG ${escapeHtml(r.room.toUpperCase())}</div>
        </div>
        <img src="${LOGO2_DATA}" class="edaran-logo">
      </div>
      <div class="edaran-guru">Guru: ${escapeHtml(r.guru)||'-'}</div>

      <table class="print-table">
        <thead><tr><th class="c-no">NO</th><th class="c-nama">NAMA LENGKAP</th><th class="c-kelas">KELAS</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </section>`;
  }).join('');

  return `<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Cetak Edaran Kelas Tilawati</title>
<style>
  @page{ size:A4; margin:16mm; }
  *{box-sizing:border-box;}
  body{ font-family:'Cambria','Georgia',serif; color:#000; margin:0; }
  .print-page{ page-break-after:always; }
  .print-page:last-child{ page-break-after:auto; }
  .edaran-head{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .edaran-logo{ width:52px; height:52px; object-fit:contain; }
  .edaran-titles{ flex:1; text-align:center; }
  .edaran-title{ font-size:22px; font-weight:bold; text-align:center; line-height:1.3; }
  .edaran-guru{ font-size:14px; font-weight:bold; text-align:left; margin-top:6px; }
  .edaran-tanggal{ font-size:12px; text-align:right; padding-bottom:6px; margin-bottom:12px; border-bottom:1px solid #000; }
  .print-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .print-table th, .print-table td{ border:1px solid #000; padding:5px 9px; }
  .print-table th{ font-weight:bold; text-align:center; }
  .c-no{ width:44px; text-align:center; }
  .c-nama{ text-align:left; }
  .c-kelas{ width:90px; text-align:center; }
  .print-table tr{ page-break-inside:avoid; }
</style></head>
<body>${pages || '<p style="padding:30px;">Tidak ada data untuk dicetak.</p>'}</body></html>`;
}

function doPrint(){
  let iframe = document.getElementById('printFrame');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'printFrame';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(buildPrintDocument());
  doc.close();
  iframe.onload = function(){
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  };
}

}
function styleTanggalCell(cell){
  cell.font = {name:'Cambria', size:10};
  cell.alignment = {horizontal:'right', vertical:'middle'};
  cell.border = {bottom:{style:'thin'}};
}
const THIN_BOX = {top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};
function styleHeaderCell(cell){
  cell.font = {name:'Cambria', size:11, bold:true};
  cell.alignment = {horizontal:'center', vertical:'middle'};
  cell.border = THIN_BOX;
}
function styleDataCell(cell, align){
  cell.font = {name:'Cambria', size:11};
  cell.alignment = {horizontal:align, vertical:'middle'};
  cell.border = THIN_BOX;
}

async function doExcelExport(){
  if(typeof ExcelJS === 'undefined'){
    await showAlert('Modul Excel belum siap dimuat, coba lagi sebentar lagi.');
    return;
  }
  const {rooms} = assignRooms(state.cetakLevel);
  const targetRooms = state.cetakRoom === '__ALL__' ? rooms : rooms.filter(r=>r.room===state.cetakRoom);
  if(!targetRooms.length){ await showAlert('Tidak ada data untuk diekspor.'); return; }

  const tanggal = formatTanggalIndo(new Date());
  const wb = new ExcelJS.Workbook();
  const usedNames = new Set();

  targetRooms.forEach(r=>{
    let sheetName = ('Ruang ' + r.room).slice(0,31);
    let n = 1;
    while(usedNames.has(sheetName)){ sheetName = (sheetName.slice(0,28) + '_' + (n++)).slice(0,31); }
    usedNames.add(sheetName);

    const ws = wb.addWorksheet(sheetName, {views:[{showGridLines:false}]});
    ws.columns = [{width:4.73},{width:36.73},{width:8.09}];

    ws.mergeCells('A1:C1');
    ws.getCell('A1').value = state.cetakLevel.toUpperCase();
    styleTitleCell(ws.getCell('A1'));
    ws.getRow(1).height = 26;

    ws.mergeCells('A2:C2');
    ws.getCell('A2').value = `RUANG ${r.room.toUpperCase()}`;
    styleTitleCell(ws.getCell('A2'));
    ws.getRow(2).height = 26;

    ws.mergeCells('A3:C4');
    ws.getCell('A3').value = `Guru: ${r.guru || '-'}`;
    styleGuruCell(ws.getCell('A3'));
    ws.getRow(3).height = 20.5;
    ws.getRow(4).height = 20.5;

    ws.mergeCells('A5:C5');
    ws.getCell('A5').value = tanggal;
    styleTanggalCell(ws.getCell('A5'));
    ws.getRow(5).height = 22;

    const headerRow = ws.getRow(6);
    headerRow.getCell(1).value = 'NO';
    headerRow.getCell(2).value = 'NAMA LENGKAP';
    headerRow.getCell(3).value = 'KELAS';
    [1,2,3].forEach(c=>styleHeaderCell(headerRow.getCell(c)));
    headerRow.height = 19.5;

    const quota = getQuotaForRoom(r.room);
    for(let i=0;i<quota;i++){
      const row = ws.getRow(7+i);
      const s = r.students[i];
      row.getCell(1).value = i+1;
      row.getCell(2).value = s ? s.nama : '';
      row.getCell(3).value = s ? (s.kelas||'') : '';
      styleDataCell(row.getCell(1), 'center');
      styleDataCell(row.getCell(2), 'left');
      styleDataCell(row.getCell(3), 'center');
    }
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Edaran_Tilawati_${state.cetakLevel.replace(/[^a-zA-Z0-9]/g,'_')}_${state.cetakRoom==='__ALL__'?'semua_ruang':state.cetakRoom.replace(/[^a-zA-Z0-9]/g,'_')}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderDashboard(){
  const totalSiswa = state.siswaList.length;
  const totalGuru = state.guruList.length;
  const totalRuangan = allDistinctRooms().length;
  const belumTilawati = state.siswaList.filter(s=>!s.tilawati).length;

  let overCapacityWarnings = [];

    if(leftover.length > 0){
      overCapacityWarnings.push(`${l.label}: ${leftover.length} siswa belum tertampung ruangan`);
    }

  const levelRows = LEVELS.map(l=>{
    const count = state.siswaList.filter(s=>s.tilawati===l.label).length;
    const roomCount = getRoomsForLevel(l.kode).length;
    return `<tr>
      <td>${l.label}</td>
      <td>${count} siswa</td>
      <td>${roomCount} ruangan</td>
    </tr>`;
  }).join('');

  return `
    <div class="grid-4" style="margin-bottom:22px;">
      <div class="card stat-card">
        <div class="stat-label">Total Siswa</div>
        <div class="stat-value">${totalSiswa}</div>

      </div>

        <div class="stat-label">Total Guru</div>
        <div class="stat-value">${totalGuru}</div>
        <div class="stat-sub">aktif mengajar</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Ruangan Terpakai</div>
        <div class="stat-value">${totalRuangan}</div>
        <div class="stat-sub">di seluruh tingkatan</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Belum Ada Tilawati</div>
        <div class="stat-value" style="color:${belumTilawati>0?'#B65C4A':'#0F5C52'}">${belumTilawati}</div>
        <div class="stat-sub">siswa perlu diisi levelnya</div>
      </div>
    </div>

    ${overCapacityWarnings.length ? `
      <div class="banner warn">
        <span>&#9888;</span>
        <div>
          <strong>Ada ruangan yang penuh:</strong><br>
          ${overCapacityWarnings.join('<br>')}
          <br><span style="opacity:.85">Tambah guru/ruangan baru untuk level tsb di halaman Data Guru, atau naikkan kuota di Pengaturan Kuota.</span>
        </div>

      <div class="banner info"><span>&#10003;</span><div>Semua siswa yang sudah diberi Tilawati tertampung dalam ruangan yang tersedia.</div></div>

        <tbody>${levelRows}</tbody>
      </table>
    </div>
  `;
}

function bindSiswaEvents(){
  const searchInput = document.getElementById('siswaSearchInput');
  searchInput.addEventListener('input', ()=>{
    state.siswaSearch = searchInput.value;
    state.siswaPage = 1;
    render();
    document.getElementById('siswaSearchInput').focus();
    const val = document.getElementById('siswaSearchInput');
    val.selectionStart = val.selectionEnd = val.value.length;
  });

  document.getElementById('siswaFilterLevel').addEventListener('change', (e)=>{
    state.siswaFilterLevel = e.target.value;
    state.siswaPage = 1;
    render();
  });

  document.getElementById('siswaPrev').addEventListener('click', ()=>{ state.siswaPage--; render(); });
  document.getElementById('siswaNext').addEventListener('click', ()=>{ state.siswaPage++; render(); });

  document.getElementById('btnAddSiswa').addEventListener('click', async ()=>{
    const nama = document.getElementById('newSiswaNama').value.trim();
    const kelas = document.getElementById('newSiswaKelas').value.trim();
    const tilawati = document.getElementById('newSiswaTilawati').value;
    if(!nama){ await showAlert('Nama siswa wajib diisi.'); return; }
    await safeListUpdate('siswa-list', 'siswaList', list=>{
      const maxNo = list.reduce((m,s)=>Math.max(m, s.no||0), 0);
      list.push({id:uid('s'), no:maxNo+1, nama, kelas, tilawati});
    });
    state.siswaSearch=''; state.siswaFilterLevel=''; state.siswaPage=1;
    render();
  });

  document.querySelectorAll('#siswaTbody tr[data-id]').forEach(tr=>{
    const id = tr.getAttribute('data-id');
    tr.querySelector('.siswa-nama').addEventListener('change', (e)=>{
      const val = e.target.value.trim();
      safeListUpdate('siswa-list', 'siswaList', list=>{
        const s = list.find(x=>x.id===id); if(s) s.nama = val;
      });
    });
    tr.querySelector('.siswa-kelas').addEventListener('change', (e)=>{
      const val = e.target.value.trim();
      safeListUpdate('siswa-list', 'siswaList', list=>{
        const s = list.find(x=>x.id===id); if(s) s.kelas = val;
      });
    });
    tr.querySelector('.siswa-tilawati').addEventListener('change', async (e)=>{
      const val = e.target.value;
      await safeListUpdate('siswa-list', 'siswaList', list=>{
        const s = list.find(x=>x.id===id);
        if(s){ s.tilawati = val; s.roomOverride = ''; } // reset manual room when level changes
      });
      render();
    });
    const ruanganSel = tr.querySelector('.siswa-ruangan');
    if(ruanganSel){
      ruanganSel.addEventListener('change', (e)=>{
        const val = e.target.value;
        safeListUpdate('siswa-list', 'siswaList', list=>{
          const s = list.find(x=>x.id===id); if(s) s.roomOverride = val;
        });
      });
    }
    tr.querySelector('.siswa-del').addEventListener('click', async ()=>{
      const ok = await showConfirm('Hapus siswa ini dari data? Tindakan ini tidak bisa dibatalkan.'); if(!ok) return;
      await safeListUpdate('siswa-list', 'siswaList', list=>{
        const idx = list.findIndex(x=>x.id===id);
        if(idx !== -1) list.splice(idx,1);
      });
      render();
    });
  });
}

/* ======================= ADMIN SESSION QUOTA (maks 3 Admin bersamaan) =======================
   Mencegah lebih dari 3 Admin login bersamaan, yang sebelumnya menyebabkan
   data "bug"/hilang karena saling menimpa. Sesi aktif dicatat di penyimpanan
   bersama (key 'admin-sessions') dan diperbarui berkala (heartbeat) selagi
   Admin itu masih membuka halaman. Sesi yang sudah lebih dari 90 detik tidak
   ada heartbeat dianggap mati (mis. tab ditutup) dan otomatis dibersihkan. */
const ADMIN_SESSION_ID = uid('adm');
const ADMIN_SESSION_STALE_MS = 90 * 1000;
const ADMIN_SESSION_MAX = 3;
let adminHeartbeatTimer = null;

async function tryRegisterAdminSession(){
  const now = Date.now();
  let sessions = await storageGet('admin-sessions');
  if(!Array.isArray(sessions)) sessions = [];
  sessions = sessions.filter(s => s.id === ADMIN_SESSION_ID || (now - (s.lastSeen||0)) < ADMIN_SESSION_STALE_MS);

  const alreadyIn = sessions.some(s=>s.id===ADMIN_SESSION_ID);
  if(!alreadyIn && sessions.length >= ADMIN_SESSION_MAX){
    return {ok:false, count:sessions.length};
  }
  const others = sessions.filter(s=>s.id!==ADMIN_SESSION_ID);
  others.push({id:ADMIN_SESSION_ID, lastSeen:now});
  await storageSet('admin-sessions', others);
  return {ok:true, count:others.length};
}

async function adminHeartbeat(){
  const now = Date.now();
  let sessions = await storageGet('admin-sessions');
  if(!Array.isArray(sessions)) sessions = [];
  sessions = sessions.filter(s => s.id !== ADMIN_SESSION_ID && (now - (s.lastSeen||0)) < ADMIN_SESSION_STALE_MS);
  sessions.push({id:ADMIN_SESSION_ID, lastSeen:now});
  await storageSet('admin-sessions', sessions);
}

function startAdminHeartbeat(){
  stopAdminHeartbeat();
  adminHeartbeatTimer = setInterval(adminHeartbeat, 30000);
}

function stopAdminHeartbeat(){
  if(adminHeartbeatTimer){ clearInterval(adminHeartbeatTimer); adminHeartbeatTimer = null; }
}

async function releaseAdminSession(){
  try{
    let sessions = await storageGet('admin-sessions');
    if(!Array.isArray(sessions)) return;
    sessions = sessions.filter(s=>s.id !== ADMIN_SESSION_ID);
    await storageSet('admin-sessions', sessions);
  }catch(e){ /* best-effort */ }
}

window.addEventListener('beforeunload', ()=>{
  if(state.role === 'admin') releaseAdminSession();
});

function handleLogin(e){
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');

  const account = ACCOUNTS.find(a => a.username.toLowerCase() === username.toLowerCase() && a.password === password);
  if(!account){
    errBox.textContent = 'Username atau password salah. Coba lagi.';
    return;
  }
  if(account.role === 'penguji'){
    const namaPenguji = document.getElementById('loginPengujiName').value.trim();
    if(!namaPenguji){
      errBox.textContent = 'Mohon isi nama Anda untuk tanda tangan blanko penilaian.';
      return;
    }
    state.pengujiName = namaPenguji;
  }

  errBox.textContent = '';

  const proceedLogin = ()=>{
    state.role = account.role;
    document.getElementById('whoAmI').textContent = account.role === 'admin' ? 'Masuk sebagai Admin' : ('Penguji: ' + state.pengujiName);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    state.view = account.role === 'admin' ? 'dashboard' : 'uji';
    startApp();
  };

  if(account.role === 'admin'){
    errBox.textContent = 'Memeriksa jumlah Admin yang sedang aktif...';
    tryRegisterAdminSession().then(result=>{
      if(!result.ok){
        errBox.textContent = `Maaf, sudah ada ${ADMIN_SESSION_MAX} Admin yang sedang aktif bersamaan. Coba lagi beberapa saat lagi.`;
        return;
      }
      errBox.textContent = '';
      startAdminHeartbeat();
      proceedLogin();
    }).catch(()=>{
      // Kalau pengecekan kuota gagal (mis. jaringan), tetap izinkan masuk
      // daripada memblokir Admin sepenuhnya.
      startAdminHeartbeat();
      proceedLogin();
    });
  }else{
    proceedLogin();
  }
}

function handleLogout(){
  if(state.role === 'admin'){
    stopAdminHeartbeat();
    releaseAdminSession();
  }
  state.role = null;
  state.pengujiName = '';
  document.getElementById('loginForm').reset();
  document.getElementById('loginError').textContent = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.getElementById('logoutBtn').addEventListener('click', handleLogout);
document.getElementById('loginUsername').addEventListener('input', (e)=>{
  const wrap = document.getElementById('loginPengujiNameWrap');
  wrap.style.display = e.target.value.trim().toLowerCase() === 'penguji' ? 'block' : 'none';
});

let appStarted = false;
async function startApp(){
  if(appStarted){ render(); return; }
  appStarted = true;
  const c = document.getElementById('content');
  c.innerHTML = `<div class="empty-state"><div class="big">Memuat data...</div>Mengambil data siswa &amp; guru.</div>`;
  try{
    await loadAllData();
  }catch(e){
    // Jangan biarkan aplikasi macet di layar "Memuat data..." walau
    // penyimpanan gagal total; tetap lanjut pakai data bawaan (seed).
    console.error('Gagal memuat data, memakai data bawaan:', e);
    if(!state.siswaList || !state.siswaList.length) state.siswaList = SEED_SISWA.slice();
    if(!state.guruList || !state.guruList.length) state.guruList = SEED_GURU.slice();
    if(!state.roomQuota) state.roomQuota = {};
    if(!state.penilaianList) state.penilaianList = [];
    state.loaded = true;
  }
  render();
}

})();
